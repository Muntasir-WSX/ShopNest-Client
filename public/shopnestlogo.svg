<svg width="500" height="300" viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" /> <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" /> </linearGradient>
    
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" /> <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" /> </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="500" height="300" fill="transparent"/>

  <g transform="translate(250, 100)">
    <path d="M-45,-30 L45,-30 L55,40 C55,55 40,65 0,65 C-40,65 -55,55 -55,40 Z" fill="url(#mainGrad)" />
    
    <path d="M-25,-30 L-25,-45 C-25,-60 -15,-65 0,-65 C15,-65 25,-60 25,-45 L25,-30" fill="none" stroke="#059669" stroke-width="8" stroke-linecap="round"/>
    
    <path d="M-15,30 L-15,-5 L15,30 L15,-5" fill="none" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    
    <g filter="url(#glow)">
      <path d="M60,-40 L62,-46 L68,-48 L62,-50 L60,-56 L58,-50 L52,-48 L58,-46 Z" fill="url(#aiGrad)" />
      <circle cx="75" cy="-30" r="3" fill="url(#aiGrad)" />
      <circle cx="50" cy="-20" r="2" fill="url(#aiGrad)" />
    </g>
  </g>

  <text x="250" y="220" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="48" font-weight="900" text-anchor="middle" fill="#064e3b" letter-spacing="-1">ShopNest</text>
  
  <text x="250" y="255" font-family="Segoe UI, Roboto, sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#059669" letter-spacing="2" text-transform="uppercase">Your Smart Grocery Partner</text>
</svg>